<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DrugBug Analytics</title>
<meta name="theme-color" content="#13111c">
<link rel="icon" type="image/png" sizes="48x48" href="../admin/icon-48.png">
<style>
:root{--bg:#f6f4fc;--surface:#fff;--surface2:#f1edfa;--ink:#1c1730;--muted:#5f5878;--line:#e2dcef;--grid:#ece8f4;--accent:#6d28d9;--s1:#2a78d6;--s2:#eb6834;--good:#047857;--warn:#b45309;--bad:#b91c1c;--h0:#f1edfa;--h1:#cde2fb;--h2:#9ec5f4;--h3:#6da7ec;--h4:#3987e5;--h5:#256abf;--h6:#184f95;--h7:#0d366b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111c;--surface:#1d1a2a;--surface2:#251f37;--ink:#f2effb;--muted:#aaa3c4;--line:#322c47;--grid:#2a2540;--accent:#a78bfa;--s1:#3987e5;--s2:#d95926;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--h0:#251f37;--h1:#0d366b;--h2:#104281;--h3:#184f95;--h4:#1c5cab;--h5:#2a78d6;--h6:#5598e7;--h7:#9ec5f4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13111c;--surface:#1d1a2a;--surface2:#251f37;--ink:#f2effb;--muted:#aaa3c4;--line:#322c47;--grid:#2a2540;--accent:#a78bfa;--s1:#3987e5;--s2:#d95926;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--h0:#251f37;--h1:#0d366b;--h2:#104281;--h3:#184f95;--h4:#1c5cab;--h5:#2a78d6;--h6:#5598e7;--h7:#9ec5f4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 70px}
.hide{display:none!important}
header.site{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 0 12px;border-bottom:1px solid var(--line)}
header.site img{width:34px;height:34px;border-radius:9px}header.site b{font-size:19px}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--accent);color:#fff}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar select{width:auto;max-width:100%}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{flex:none;font:inherit;font-weight:650;font-size:14px;padding:7px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected=true]{color:var(--ink);background:var(--surface);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.card h2{font-size:17px;margin:0 0 2px}.card h3{font-size:15px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:900px){.grid2{grid-template-columns:1fr}}
button.btn{font:inherit;font-weight:700;font-size:14px;padding:8px 13px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{font:inherit;font-size:13px;font-weight:650;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.ghost:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
input,select,textarea{font:inherit;font-size:14px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:100%}
label.sw{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}label.sw input{width:auto}
.msg{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:14px;margin:8px 0}.msg.err{border-color:var(--bad)}.msg.ok{border-color:var(--good)}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d b.up{color:var(--good)}.kpi .d b.dn{color:var(--bad)}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap;z-index:3;color:var(--ink)}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}
/* heatmap */
.heat{display:grid;grid-template-columns:38px repeat(24,minmax(0,1fr));gap:2px;font-size:11px;color:var(--muted)}
.heat .c{aspect-ratio:1/1;border-radius:3px;background:var(--h0);min-height:10px}
.heat .c:hover{outline:2px solid var(--ink)}
.heat .rl{display:flex;align-items:center}
.heatkey{display:flex;gap:2px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:8px}.heatkey span{width:18px;height:10px;border-radius:2px}
/* bars and tables */
.trk{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:6px 14px;align-items:center;font-size:13.5px}
.trk .h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hb{display:flex;align-items:center;gap:8px}.hb span.b{height:12px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}.hb em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:700px){.trk{grid-template-columns:100px repeat(3,minmax(0,1fr));font-size:12.5px}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
th[data-s]{cursor:pointer}th[data-s]:hover{color:var(--ink)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}th.n{text-align:right}
.flag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor;margin:1px 4px 1px 0;white-space:nowrap}
.flag.bad{color:var(--bad)}.flag.warn{color:var(--warn)}.flag.ok{color:var(--good)}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--grid);margin-top:4px;max-width:240px}
.dist span{display:block;height:100%}
.qtext{max-width:520px}
.lab{width:150px;padding:4px 8px;font-size:13px}
.divnote{font-size:12px;color:var(--muted)}
.guide h3{margin:4px 0 8px;font-size:18px}.guide h4{margin:16px 0 4px;font-size:15px}.guide ul,.guide ol{padding-left:22px}.guide li{margin:4px 0}.guide p{margin:6px 0}
.hero{border:2px solid var(--good);border-radius:14px;padding:16px;background:var(--surface)}
.hero h2{margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <img src="../admin/icon-48.png" alt=""><b>DrugBug Analytics</b><span class="badge" id="roleBadge"></span>
  <div class="who" id="who"></div>
</header>

<section id="vIn" class="card hide" style="max-width:440px;margin:40px auto">
  <h2>Sign in</h2><p class="sub">For the DrugBug owner and class instructors.</p>
  <label class="small" for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label class="small" for="pw" style="display:block;margin-top:8px">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:12px"><button class="btn" id="bIn">Sign in</button><button class="ghost" id="bGoogle">Continue with Google</button></div>
  <div id="inMsg" class="msg err hide"></div>
</section>

<div id="vMain" class="hide">
  <div class="bar">
    <select id="scope" aria-label="What to show"></select>
    <select id="range" aria-label="Date range"><option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="180">Last 180 days</option><option value="365">Last 365 days</option></select>
    <select id="plat" aria-label="Platform"><option value="">Web and iPhone</option><option value="web">Web</option><option value="ios">iPhone</option></select>
    <select id="trackSel" aria-label="Specialty track"><option value="">All tracks</option></select>
    <label class="sw" id="intWrap"><input type="checkbox" id="internal"> Include internal / test traffic</label>
    <nav class="tabs" id="tabs" style="margin-left:auto"></nav>
  </div>
  <div id="topMsg" class="msg hide"></div>
  <div id="page"></div>
</div>
</div>

<script src="../app/vendor/firebase-app-compat.js"></script>
<script src="../app/vendor/firebase-auth-compat.js"></script>
<script>

     instructor saves on their own computer. */
  var CFG = { apiKey: "AIzaSyC7cNkPSpPqfHPLNSY54u8QSL1jnaYsVMM", authDomain: "drugbug-69d42.firebaseapp.com", projectId: "drugbug-69d42", appId: "1:123306339603:web:2a0021f13fd8e620253ee6" };
  var FN = "https://us-central1-drugbug-69d42.cloudfunctions.net/";

  if (local) { CFG.apiKey = "demo-key"; CFG.projectId = "demo-drugbug"; FN = "http://127.0.0.1:5001/demo-drugbug/us-central1/"; }

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var show = function (el, on) { (typeof el === "string" ? $(el) : el).classList.toggle("hide", !on); };

      .then(function (r) { if (r.status === 404) throw new Error("not deployed"); return r.json(); }).then(function (j) { if (j.error) throw new Error(j.error.message || j.error.status); return j.result; });

  var MODES = { std: "Question banks", rush: "Bug Rush", proto: "Protocols", game: "Games" };
  var LV = { emt: "EMT", aemt: "AEMT", paramedic: "Paramedic", flight: "Flight Paramedic", cp: "Community Paramedic", cpp: "Critical Care Paramedic", cna: "CNA", lvn: "LVN / LPN", rn: "RN", rnschool: "Nursing school (RN)", rnbridge: "Paramedic to RN bridge", flightrn: "Flight Nurse", ms1: "Medical Student (Preclinical)", ms3: "Medical Student (Clinical)", intern: "Intern" };
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  
  /* ---------- catalogue: question text, drug and drug class for question ids (public question bank) ---------- */
  var CAT = null;
  function catalog() {
    if (CAT) return Promise.resolve(CAT);
    return fetch("../qedit/catalog.json?v=" + Math.floor(Date.now() / 3600000)).then(function (r) { return r.json(); }).then(function (c) {

    }).catch(function () { CAT = { by: {}, classes: {} }; return CAT; });
  }
  function hashStr(s) { var h = 5381; s = String(s); for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function wrongText(it, h) { if (!it || !it.w) return null; for (var i = 0; i < it.w.length; i++) if (hashStr(it.w[i]).slice(0, 6) === h) return it.w[i]; return null; }
  var EDGES = [0, 10, 20, 40, 90, 180, 300];   /* band edges in seconds; the last band is "over 3 minutes" */
  function medianSec(t) { var n = 0, i; for (i = 0; i < 6; i++) n += t[i] || 0; if (!n) return null; var half = n / 2, run = 0; for (i = 0; i < 6; i++) { var b = t[i] || 0; if (b && run + b >= half) return Math.round(EDGES[i] + ((half - run) / b) * (EDGES[i + 1] - EDGES[i])); run += b; } return 300; }   /* interpolated inside the band */

  /* ---------- chart helpers (hand-built SVG: one axis, recessive grid, hover crosshair + tooltip) ---------- */
  function niceMax(v) { if (!(v > 0)) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
  /* series: [{name, color (css var), values: [number|null], dash?}], x: labels. marker: index of the clean-telemetry divider */
  function lineChart(el, x, series, o) {
    o = o || {}; var W = el.clientWidth || 600, H = o.h || 200, L = 44, R = 12, T = 10, B = 24, iw = W - L - R, ih = H - T - B;
    var max = niceMax(Math.max.apply(null, series.map(function (s) { return Math.max.apply(null, s.values.map(function (v) { return v || 0; })); })) * 1.05);
    var X = function (i) { return L + (x.length <= 1 ? iw / 2 : (i * iw) / (x.length - 1)); }, Y = function (v) { return T + ih - (v / max) * ih; };
    var g = "", k;
    for (k = 0; k <= 4; k++) { var gv = (max * k) / 4, gy = Y(gv); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--grid)"/><text x="' + (L - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + (o.fmt ? o.fmt(gv) : fmt(gv)) + "</text>"; }
    var step = Math.max(1, Math.ceil(x.length / Math.max(2, Math.floor(iw / 80))));
    for (k = 0; k < x.length; k += step) g += '<text x="' + X(k) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(o.xfmt ? o.xfmt(x[k]) : x[k]) + "</text>";
    if (o.marker != null && o.marker >= 0 && o.marker < x.length) { var mx = X(o.marker); var right = mx > W * 0.55; g += '<line x1="' + mx + '" x2="' + mx + '" y1="' + T + '" y2="' + (T + ih) + '" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="' + (right ? mx - 5 : mx + 5) + '" y="' + (T + 11) + '" text-anchor="' + (right ? "end" : "start") + '" style="fill:var(--good);font-weight:700">Clean telemetry active</text>'; }
    series.forEach(function (s) {
      var d = "", pen = false;
      s.values.forEach(function (v, i) { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
      g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="5 4"' : "") + "/>";
    });

      show(tip, true); var tx = (X(i) / W) * r.width; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(0, tx + 12)) + "px"; tip.style.top = "8px";

  function legend(items) { return '<div class="legend">' + items.map(function (s) { return '<span><i' + (s.dash ? ' class="dash"' : "") + ' style="background:' + s.color + '"></i>' + esc(s.name) + "</span>"; }).join("") + "</div>"; }
  function heatmap(el, cells, note) {
    /* cells[dow][hour] = number */
    var max = 0, d, h; for (d = 0; d < 7; d++) for (h = 0; h < 24; h++) max = Math.max(max, cells[d][h] || 0);
    var lev = function (v) { return !v ? 0 : Math.min(7, 1 + Math.floor((v / max) * 6.999)); };
    var c = '<div class="heat"><span></span>' + Array.from({ length: 24 }, function (_, i) { return '<span style="text-align:center">' + (i % 3 === 0 ? (i === 0 ? "12a" : i < 12 ? i + "a" : i === 12 ? "12p" : i - 12 + "p") : "") + "</span>"; }).join("");
    for (d = 0; d < 7; d++) { c += '<span class="rl">' + DAYS[d] + "</span>"; for (h = 0; h < 24; h++) c += '<span class="c" style="background:var(--h' + lev(cells[d][h]) + ')" data-t="' + DAYS[d] + " " + (h === 0 ? "12 am" : h < 12 ? h + " am" : h === 12 ? "12 pm" : h - 12 + " pm") + ": " + fmt(cells[d][h] || 0) + ' active minutes"></span>'; }
    c += '</div><div class="heatkey">Fewer <span style="background:var(--h1)"></span><span style="background:var(--h3)"></span><span style="background:var(--h5)"></span><span style="background:var(--h7)"></span> More active minutes' + (note ? ' <span style="margin-left:auto">' + esc(note) + "</span>" : "") + '</div><div class="tip hide"></div>';
    el.innerHTML = c; el.style.position = "relative";

  function editSection(x) {
    var el = $("g-" + x.id);
    el.innerHTML = '<h3>Edit: ' + esc(x.title) + '</h3><p class="sub">Markdown: ## heading, ### small heading, - bullet, 1. step, **bold**, [text](https://link), | table |. Placeholders for the class being viewed: {{className}} {{joinCode}} {{seats}} {{level}} {{endDate}}. Saved text shows to every instructor right away.</p><label class="small" for="gT">Section name</label><input id="gT" value="' + esc(x.title) + '"><label class="small" for="gM" style="display:block;margin-top:8px">Text</label><textarea id="gM" rows="22" spellcheck="true" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">' + esc(x.md) + '</textarea><div class="row" style="margin-top:10px"><button class="btn" id="gSave">Save for every instructor</button><button class="ghost" id="gCancel">Cancel</button><span class="small muted" id="gMsg"></span></div><div class="card" style="margin-top:12px"><p class="small muted">Preview</p><div id="gPrev"></div></div>';
    var prev = function () { $("gPrev").innerHTML = md(fillGuide($("gM").value)); }; $("gM").oninput = prev; prev();
    $("gCancel").onclick = drawGuide;
    $("gSave").onclick = function () {
      var b = this; b.disabled = true;
      var next = GUIDE.sections.map(function (s) { return s.id === x.id ? { id: s.id, title: $("gT").value.trim() || s.title, md: $("gM").value, print: !!s.print, only: s.only } : s; });
      call("anaGuideSet", { sections: next }).then(function () { GUIDE = null; top("Saved. Instructors see the new text now.", "ok"); drawGuide(); }).catch(function (e) { b.disabled = false; $("gMsg").textContent = errTxt(e); });
    };
  }
  function reqForm() {
    var O = scope().slice(0, 4) === "org:" && DATA.o ? DATA.o.org : null, u = auth.currentUser;
    return '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><h4>Add classes, seats or your own protocols</h4><div class="row"><input id="rqName" placeholder="Your full name" style="flex:1;min-width:180px"><input id="rqEmail" type="email" placeholder="Work email" value="' + esc((u && u.email) || "") + '" style="flex:1;min-width:200px"><input id="rqOrg" placeholder="School or agency" value="' + esc(O ? O.name : "") + '" style="flex:1;min-width:200px"></div><div class="row" style="margin-top:8px"><select id="rqPkg" style="max-width:220px"><option value="unsure">Not sure yet</option><option value="analytics">Analytics</option><option value="protocols">Protocols</option><option value="combined">Combined Suite</option><option value="premium">Premium</option></select><input id="rqPeople" type="number" min="1" placeholder="How many people" style="max-width:170px"><input id="rqNotes" placeholder="What you need (more seats, another cohort, custom protocols…)" style="flex:2;min-width:240px"></div><div class="row" style="margin-top:8px"><button class="btn" id="rqGo">Send request</button><span class="small muted" id="rqMsg">DrugBug replies by email, usually within one business day.</span></div></div>';
  }
  function wireReq() {
    if (!$("rqGo")) return;
    $("rqGo").onclick = function () {
      var b = this; b.disabled = true;
      call("orgInquiry", { org: $("rqOrg").value, name: $("rqName").value, email: $("rqEmail").value, pkg: $("rqPkg").value, people: $("rqPeople").value, kind: "School or program", notes: "From the instructor portal: " + $("rqNotes").value }).then(function () { $("rqMsg").textContent = "Sent. DrugBug will reply by email."; }).catch(function (e) { b.disabled = false; $("rqMsg").textContent = errTxt(e); });
    };
  }

  /* ---------- boot ---------- */
  ["range", "internal"].forEach(function (id) { $(id).onchange = function () { if (scope() === "global") load(); }; });
  ["plat", "trackSel"].forEach(function (id) { $(id).onchange = function () { if (this.id === "plat" && this.value) $("trackSel").value = ""; if (this.id === "trackSel" && this.value) $("plat").value = ""; if (scope() === "global" && DATA.g) draw(); }; });
  $("scope").onchange = function () { TAB = ""; drawTabs(); load(); };
  $("trackSel").innerHTML = '<option value="">All tracks</option>' + Object.keys(TRACKS).filter(function (k) { return k !== "ev"; }).map(function (k) { return '<option value="' + k + '">' + TRACKS[k] + "</option>"; }).join("");
  $("bIn").onclick = function () { auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value).catch(function (e) { $("inMsg").textContent = (e && e.message) || "Couldn't sign in."; show("inMsg", true); }); };
  $("bGoogle").onclick = function () { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (e) { $("inMsg").textContent = (e && e.message) || "Couldn't sign in."; show("inMsg", true); }); };
  auth.onAuthStateChanged(function (u) {
    var real = u && !u.isAnonymous;
    $("who").innerHTML = real ? esc(u.email || "Signed in") + ' <button class="ghost" id="bOut">Sign out</button>' : "";
    if (real) $("bOut").onclick = function () { auth.signOut(); };
    show("vIn", !real); show("vMain", false); if (!real) return;
    call("anaWho").then(function (w) {
      ME = w; $("roleBadge").textContent = w.role === "owner" ? "Owner" : "Instructor";
      var o = w.role === "owner" ? '<option value="global">All users (global)</option><option value="schools">All schools combined</option>' : "";
      o += w.orgs.map(function (g) { return '<option value="org:' + esc(g.id) + '">' + esc(g.name) + "</option>"; }).join("");
      $("scope").innerHTML = o;
      var h = location.hash.slice(1); if (h && $("scope").querySelector('option[value="' + h + '"]')) $("scope").value = h;
      show("vMain", true); drawTabs(); load();
    }).catch(function (e) { show("vMain", true); $("page").innerHTML = '<div class="msg err">' + esc(errTxt(e)) + "</div>"; });
  });
})();
</script>
</body>
</html>
