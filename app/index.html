<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column app; colored route/level bands on a lavender-tinted ground; drug sheet slides over. */
:root{
  --bg:#f6f4fc; --surface:#ffffff; --surface-2:#efebf8; --ink:#1c1730; --muted:#5f5878; --line:#e2dcef;
  --emt:#0f9a63; --emt-soft:#dcf5ea; --aemt:#2668d8; --aemt-soft:#dfeafc;
  --medic:#d93a33; --medic-soft:#fde3e1; --flight:#7240e0; --flight-soft:#ece4fd;
  --gold:#f2ac17; --gen:#0b8f8d; --gen-soft:#d8f3f1; --plum:#8a3aa6; --plum-soft:#f3e3f8;
  --cna:#c92f6d; --cna-soft:#fce3ee; --lvn:#946200; --lvn-soft:#fbf0d4; --rn:#c4570c; --rn-soft:#fde8da;
  --lg1:#0d9488; --lg2:#2563eb; --lg3:#7c3aed;
  --ms1:#2a7a3f; --ms1-soft:#dff3e4; --ms3:#3a4fc4; --ms3-soft:#e3e7fb; --intern:#1e2a78; --intern-soft:#e1e4f4;
  --ok:#14965a; --bad:#cf3434; --warn:#b86e00;
  --shadow:0 1px 2px rgba(40,20,80,.06),0 6px 20px rgba(40,20,80,.07);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#221f2e; --surface:#302b43; --surface-2:#3a3550; --ink:#f4f1fc; --muted:#b9b2d2; --line:#4b4466;
  --emt:#34c98b; --emt-soft:#173b2d; --aemt:#5b95f5; --aemt-soft:#1a2b4a; --medic:#ff6a5f; --medic-soft:#47201f;
  --flight:#a07cff; --flight-soft:#2d2250; --gold:#ffc443; --gen:#2ccfcb; --gen-soft:#133836; --plum:#cc7ce6; --plum-soft:#3a2045;
  --cna:#ff7ab0; --cna-soft:#45182c; --lvn:#f2b632; --lvn-soft:#3d2f0e; --rn:#ff9a52; --rn-soft:#45260f;
  --lg1:#2dd4bf; --lg2:#60a5fa; --lg3:#c4b5fd;
  --ms1:#5fd07a; --ms1-soft:#173a22; --ms3:#8c9bff; --ms3-soft:#232a52; --intern:#a9b4ff; --intern-soft:#1f2550;
  --ok:#40d08a; --bad:#ff6b6b; --warn:#ffb547; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#221f2e; --surface:#302b43; --surface-2:#3a3550; --ink:#f4f1fc; --muted:#b9b2d2; --line:#4b4466;
  --emt:#34c98b; --emt-soft:#173b2d; --aemt:#5b95f5; --aemt-soft:#1a2b4a; --medic:#ff6a5f; --medic-soft:#47201f;
  --flight:#a07cff; --flight-soft:#2d2250; --gold:#ffc443; --gen:#2ccfcb; --gen-soft:#133836; --plum:#cc7ce6; --plum-soft:#3a2045;
  --cna:#ff7ab0; --cna-soft:#45182c; --lvn:#f2b632; --lvn-soft:#3d2f0e; --rn:#ff9a52; --rn-soft:#45260f;
  --lg1:#2dd4bf; --lg2:#60a5fa; --lg3:#c4b5fd;
  --ms1:#5fd07a; --ms1-soft:#173a22; --ms3:#8c9bff; --ms3-soft:#232a52; --intern:#a9b4ff; --intern-soft:#1f2550;
  --ok:#40d08a; --bad:#ff6b6b; --warn:#ffb547; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto}
.lvl-emt{--c:var(--emt);--cs:var(--emt-soft)} .lvl-aemt{--c:var(--aemt);--cs:var(--aemt-soft)}
.lvl-medic{--c:var(--medic);--cs:var(--medic-soft)} .lvl-flight{--c:var(--flight);--cs:var(--flight-soft)}
.lvl-gen{--c:var(--gen);--cs:var(--gen-soft)}
.lvl-cna{--c:var(--cna);--cs:var(--cna-soft)} .lvl-lvn{--c:var(--lvn);--cs:var(--lvn-soft)} .lvl-rn{--c:var(--rn);--cs:var(--rn-soft)}
.lvl-ms1{--c:var(--ms1);--cs:var(--ms1-soft)} .lvl-ms3{--c:var(--ms3);--cs:var(--ms3-soft)} .lvl-intern{--c:var(--intern);--cs:var(--intern-soft)}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding-block:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:0;background:none;border:0;padding:0}
.brand,.logo{background:linear-gradient(100deg,var(--lg1) 0%,var(--lg2) 55%,var(--lg3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span,.logo span{font-weight:900}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:14px;min-width:0}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-block:28px 32px}
.hero .bugstage{width:min(220px,40vw)}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,11vw,112px);letter-spacing:-.02em;line-height:.9}
.logo{padding-bottom:.08em}
.tagline{font-size:clamp(17px,2.4vw,21px);color:var(--muted);max-width:40ch;margin-top:10px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.route{position:relative;text-align:left;border:0;border-radius:24px;padding:24px;color:#fff;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:250px;transition:transform .15s}
.route:hover{transform:translateY(-3px)}
.route.ph{background:linear-gradient(135deg,#e2453a 0%,#f08a1d 100%)}
.route.gen{background:linear-gradient(135deg,#0b8f8d 0%,#6b3fb8 100%)}
.route.rn{background:linear-gradient(135deg,#c92f6d 0%,#e2731a 100%)}
.route.md{background:linear-gradient(135deg,#1e2a78 0%,#2a7a3f 100%)}
.levels.three{grid-template-columns:repeat(3,1fr)}
.route .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;font-weight:700}
.route h2{font-size:clamp(30px,4.4vw,42px);font-weight:800}
.route p{margin:0;max-width:36ch;opacity:.95}
.route .bugrow{display:flex;gap:4px;align-items:flex-end;margin-top:auto}
.route .bugrow .lvbug{width:auto;height:auto;display:inline-block}.route .bugrow svg{width:64px;height:64px} .route .bugrow .lvbug:nth-child(2) svg{width:74px;height:74px}
.route .bugrow .lvbug:nth-child(3) svg{width:86px;height:86px} .route .bugrow .lvbug:nth-child(4) svg{width:100px;height:100px}
.route .sage{position:absolute;right:12px;bottom:4px;width:140px}
.route .count{font-family:var(--f-mono);font-size:13px;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;align-self:flex-start}
.disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:75ch}

/* level picker */
.pagehead{padding-block:8px 18px}
.pagehead h1{font-size:clamp(32px,5vw,46px)}
.pagehead p{color:var(--muted);margin:6px 0 0;max-width:60ch}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lvcard{border:2px solid transparent;background:var(--surface);border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.lvcard:hover{transform:translateY(-3px);border-color:var(--c)}
.lvcard .stage{background:var(--cs);border-radius:14px;display:grid;place-items:center;padding:8px;aspect-ratio:1/1;max-width:100%}
.lvcard .stage svg{width:100%;height:100%}
.lvcard .pip{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}
.lvcard h2{font-size:26px;color:var(--c)}
.lvcard .bugname{font-weight:700;font-size:14px}
.lvcard p{margin:0;font-size:14px;color:var(--muted)}
.lvcard .n{margin-top:auto;font-size:13px;font-weight:700}

/* level header band */
.band{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--c);color:#fff;border-radius:24px;padding:16px 22px;margin-bottom:16px;overflow:hidden}
.band .bugstage{width:110px;height:110px;background:rgba(255,255,255,.16);border-radius:20px;display:grid;place-items:center}
.band .bugstage svg{width:100px;height:100px}
.band h1{font-size:clamp(28px,4.5vw,40px);font-weight:800}
.band .sub{opacity:.92;font-size:15px}
.band .meter{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:13px}
.band .meter span.p{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.3)}
.band .meter span.p.on{background:#fff}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:700;font-family:var(--f-display);font-size:17px}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}

/* registry */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font:inherit;color:var(--ink)}
.search:focus{border-color:var(--c);outline:none}
select.sel{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font:inherit;color:var(--ink);max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--cs);border-color:var(--c);color:var(--ink)}
.resultcount{font-size:13px;color:var(--muted);margin-bottom:10px;font-family:var(--f-mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
#grid .tile,#evgrid .tile,#pbgrid .tile,.ecard{content-visibility:auto;contain-intrinsic-size:auto 118px}
.shopgrid .bugcard,.wardrobe .bugcard{content-visibility:auto;contain-intrinsic-size:auto 230px}
.tile{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .12s,transform .12s;min-width:0}
.tile:hover{border-color:var(--c);transform:translateY(-2px)}
.tile .nm{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15}
.tile .cl{font-size:13px;color:var(--muted)}
.alts .altpick{margin:14px 0 6px}.alts .altpick h2{margin:2px 0}
.altnm{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}.altnm:hover{text-decoration:underline}.altnm.big{font-size:1.5rem}
.altcl{font-size:13px;color:var(--muted)}.altwhy{font-size:12.5px;font-weight:600;color:var(--ok);margin:4px 0}
.alth{margin:18px 0 8px;font-size:1.05rem}.altgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.altcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}.altcard.warn{border-color:var(--gold)}.altcard.warn .altwhy{color:var(--gold)}
.altf{font-size:13px;line-height:1.4;margin-top:4px}.altf span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.alts .callout{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13.5px;line-height:1.45}.alts .callout p{margin:6px 0 0}
.alts .aka{font-size:13px;color:var(--muted);font-weight:600}
.altsug{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.tile .aka{font-size:12.5px;font-weight:600;color:var(--ok);line-height:1.25}
.tile .mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.mini span{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tile .sched{color:var(--bad)}
.tile.pending{opacity:.55}
.empty{padding:30px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}

/* sheet */
.sheet .panel .sec,.sheet .panel .dbox{content-visibility:auto;contain-intrinsic-size:auto 260px}
.sheet{position:fixed;inset:0;background:rgba(20,10,40,.45);display:flex;justify-content:flex-end;z-index:20}
.sheet .panel{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 20px 60px;box-shadow:var(--shadow)}
.sheet .phead{position:relative;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:12px;z-index:2;border-bottom:1px solid var(--line)}
.sheet .navrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700}
.dname{font-size:clamp(30px,5vw,42px);font-weight:800;color:var(--c)}
.dsub{color:var(--muted);font-size:15px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--cs);color:var(--ink)}
.badge.ctrl{background:var(--medic-soft);color:var(--medic)}
.scopenote{margin-top:14px;background:var(--cs);border-left:5px solid var(--c);border-radius:12px;padding:10px 14px;font-weight:700}
.plain{font-size:19px;margin:16px 0 4px;line-height:1.45}
.sec{margin-top:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.sec>summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--muted)}
.sec[open]>summary::after{content:"–"}
.sec.go>summary::before{background:var(--ok)} .sec.stop>summary::before{background:var(--bad)} .sec.dose>summary::before{background:var(--gold)}
.fields{padding:0 16px 12px;display:grid;gap:0}
.f{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.f .k{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.f .v{min-width:0;overflow-wrap:anywhere}
.f .v.na{color:var(--muted);font-style:italic}
.sec.dose .f .v{font-family:var(--f-mono);font-size:14.5px}
.tagboard{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 16px}
.tagboard span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.tagboard span.on{background:var(--c);border-color:var(--c);color:#fff}
.toggle-full{margin-top:16px;width:100%;border:2px dashed var(--c);background:transparent;border-radius:14px;padding:10px;font-weight:700;color:var(--c)}
.pending-msg{margin-top:20px;padding:16px;border-radius:14px;background:var(--surface-2)}

/* scenarios */
.scenlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.scard{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.scard:hover{border-color:var(--c)}
.scard h3{font-size:20px}
.scard .meta{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.scard.done{border-color:var(--ok)}
.scen{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px}
.scen h2{font-size:28px;color:var(--c)}
.vignette{font-size:18px;margin:12px 0 16px;max-width:70ch}
.vitals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.vitals span{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:8px;padding:4px 8px}
.ask{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 14px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--c);background:var(--cs)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;background:var(--c);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;font-family:var(--f-display);font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--surface-2)}
.feedback .score{font-family:var(--f-display);font-weight:800;font-size:22px}
.feedback ul{margin:8px 0 0;padding-left:20px}
.linkish{background:none;border:0;padding:0;color:var(--c);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* flashcards */
.fcwrap{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start}
.card3d{perspective:1400px;min-height:360px}
.fc{position:relative;width:100%;min-height:360px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;border:0;padding:0;background:none;text-align:left}
.fc.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;box-shadow:var(--shadow)}
.face.front{background:var(--c);color:#fff;justify-content:center;align-items:center;text-align:center}
.face.front .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,54px);line-height:1.05}
.face.front .hint{opacity:.9}
.face.back{background:var(--surface);border:2px solid var(--c);transform:rotateY(180deg)}
.face.back h3{color:var(--c);font-size:26px}
.face.back dl{margin:0;display:grid;gap:8px}
.face.back dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.face.back dd{margin:0}
.fcside{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fcside .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prog{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.fcnav{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn.ok{background:var(--ok)} .btn.again{background:var(--bad)}

.rptbtn{font-size:13.5px;color:var(--muted)}
.rsheet{justify-content:center;align-items:center;padding:16px}
.rsheet .panel{height:auto;max-height:92vh;width:min(560px,100%);border-radius:18px;padding:18px 20px}
.rsheet .navrow{display:flex;align-items:center;gap:8px}.rsheet .dname{margin:0;font-size:22px}
.rprow{align-items:flex-start}.rprow p{margin:4px 0}
.rcrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rcrow .spacer{flex:1}
.cprow{flex-direction:column;align-items:flex-start}
#printv{background:#fff;color:#111;min-height:100vh;margin:0 -16px;padding:12px 16px 40px}
#printv .pr-bar{position:sticky;top:0;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #ccc;z-index:2;color:#111}
#printv .pr-bar .spacer{flex:1}#printv .muted{color:#555}#printv .presult{background:#eef2ff;color:#1b1430;border:1px solid #c7d2fe;font-size:15px}
#printv .chip{color:#111;background:#f3f3f3}#printv .chip[aria-pressed="true"]{background:#222;color:#fff}
body.printing>*:not(#printv){display:none!important}
@media print{
  body{background:#fff!important;padding:0!important}
  body>*:not(#printv){display:none!important}
  #printv{margin:0;padding:0}.noprint{display:none!important}
}

/* settings */
.gear{display:inline-flex;align-items:center;gap:6px}
html[data-text="large"]{zoom:1.12} html[data-text="xl"]{zoom:1.25}
html[data-contrast="1"]{--muted:#2e2845;--line:#7a7096;--surface-2:#e4def3}
@media (prefers-color-scheme: dark){html[data-contrast="1"]:not([data-theme="light"]){--muted:#e2ddf2;--line:#8d84ad;--ink:#ffffff}}
html[data-contrast="1"][data-theme="dark"]{--muted:#e2ddf2;--line:#8d84ad;--ink:#ffffff}
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.settings{max-width:900px;margin:0 auto;--c:var(--flight)}
.setnav{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 14px}.setnav a{color:var(--c);font-weight:700;font-size:14px}
.setcard{background:var(--surface);border-radius:18px;padding:6px 18px 10px;margin:12px 0;box-shadow:var(--shadow);scroll-margin-top:12px}
.setcard h2{font-family:var(--f-display);font-size:20px;margin:12px 0 4px}
.setrow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setcard h2+.setrow{border-top:0}
.setrow .sl{display:flex;flex-direction:column;min-width:200px;flex:1 1 240px}.setrow .sc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.segs{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg{border:0;background:var(--surface);padding:7px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.seg+.seg{border-left:1.5px solid var(--line)}.seg[aria-checked="true"]{background:var(--c);color:#fff}
.tog{display:inline-flex;align-items:center;gap:10px;cursor:pointer}.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tgl{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog input:checked+.tgl{background:var(--c)}.tog input:checked+.tgl::after{transform:translateX(18px)}
.tog input:focus-visible+.tgl{outline:3px solid var(--gold);outline-offset:2px}
.tog span:last-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.setrow form.inl{display:flex;gap:6px;flex-wrap:wrap}.setrow .pinput{max-width:260px}
.cbar.wide{width:180px}
@media (max-width:560px){.gear span{display:none}}
.badge.rvb.clin{background:var(--aemt-soft);color:var(--aemt)}.badge.rvb.ver{background:var(--emt-soft);color:var(--emt)}.badge.rvb.draft{background:var(--surface-2);color:var(--muted)}

/* bug buddy */
#buddy{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:15;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
#buddy .bbtn{pointer-events:auto;width:110px;height:110px;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:4px;display:grid;place-items:center}
#buddy .bug.buddyart{width:98px;height:98px}
#buddy .bubble{pointer-events:auto;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:700;font-size:14px;margin:0 0 6px 6px;max-width:220px;box-shadow:var(--shadow);position:relative;animation:pop .25s ease-out}
#buddy .bubble::after{content:"";position:absolute;left:28px;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
#buddy.m-joy .bbtn,#buddy.m-star .bbtn,#buddy.m-heart .bbtn{animation:hop .5s ease-out 2}
#buddy.m-sad .bbtn{animation:droop .6s ease-out}
#buddy.m-shock .bbtn,#buddy.m-dizzy .bbtn{animation:shake .4s ease-in-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}70%{transform:translateY(-4px) rotate(3deg)}}
@keyframes droop{0%{transform:none}50%{transform:translateY(6px) scale(.96)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.bug .spinx{animation:spin .6s linear infinite;transform-box:fill-box;transform-origin:center}
/* wardrobe item animations */
.bug .it,.bug .it [class*="ia-"]{transform-box:fill-box}
.ia-tilt{transform-origin:50% 100%;animation:iaTilt 3.2s ease-in-out infinite alternate}
.ia-peek{animation:iaPeek 3.6s ease-in-out infinite}
.ia-sway{transform-origin:50% 0;animation:iaSway 2.6s ease-in-out infinite alternate}
.ia-bob{animation:iaBob 1.8s ease-in-out infinite alternate}
.ia-float{animation:iaFloat 3s ease-in-out infinite alternate}
.ia-flap{transform-origin:50% 50%;animation:iaFlap .7s ease-in-out infinite alternate}
.ia-billow{transform-origin:50% 0;animation:iaBillow 2.2s ease-in-out infinite alternate}
.ia-breathe{transform-origin:50% 100%;animation:iaBreathe 3s ease-in-out infinite alternate}
.ia-pulse{transform-origin:50% 50%;animation:iaPulse 1.8s ease-in-out infinite alternate}
.ia-flicker{transform-origin:50% 0;animation:iaFlicker .35s steps(2) infinite alternate}
.ia-flash{animation:iaFlash 2.2s linear infinite}
.ia-hum{animation:iaHum 1.2s ease-in-out infinite alternate}
.ia-shimmer{animation:iaShimmer 2.6s ease-in-out infinite alternate}
.ia-drift{animation:iaDrift 4s ease-in-out infinite alternate}
.ia-wiggle{transform-origin:50% 100%;animation:iaWiggle .9s ease-in-out infinite alternate}
.ia-bounce{transform-origin:50% 0;animation:iaBounce .8s ease-in-out infinite alternate}
.ia-wave{transform-origin:0 50%;animation:iaWave 1.4s ease-in-out infinite alternate}
.ia-strum{transform-origin:30% 70%;animation:iaStrum .5s ease-in-out infinite alternate}
.ia-buzz{animation:iaBuzz .12s linear infinite alternate}
.ia-glint{animation:iaGlint 2.8s ease-in-out infinite}
.ia-blink{animation:iaBlink 1.4s steps(2) infinite}
.ia-rise{animation:iaRise 2.6s ease-in infinite}
.ia-fall{animation:iaFall 1.2s linear infinite}
.ia-snow{animation:iaSnow 4s linear infinite}
.ia-confetti{transform-origin:50% 50%;animation:iaConfetti 3s linear infinite}
.ia-leaf{transform-origin:50% 50%;animation:iaLeaf 4.5s ease-in infinite}
.ia-notes{animation:iaNotes 3s ease-out infinite}
.ia-firefly{animation:iaFirefly 3.2s ease-in-out infinite}
.ia-drip{animation:iaDrip 1.6s ease-in infinite}
.ia-orbit{transform-box:view-box!important;transform-origin:100px 120px;animation:spin 12s linear infinite}
.ia-orbit.slow{animation-duration:40s}
.ia-trace{stroke-dasharray:320;animation:iaTrace 2.4s linear infinite}
@keyframes iaTilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes iaPeek{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-2px)}}
@keyframes iaSway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes iaBob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes iaFloat{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes iaFlap{from{transform:scaleX(1)}to{transform:scaleX(.84)}}
@keyframes iaBillow{from{transform:skewX(-4deg)}to{transform:skewX(4deg)}}
@keyframes iaBreathe{from{transform:scaleY(1)}to{transform:scaleY(1.025)}}
@keyframes iaPulse{from{transform:scale(1);opacity:.85}to{transform:scale(1.08);opacity:1}}
@keyframes iaFlicker{from{transform:scaleY(1);opacity:1}to{transform:scaleY(.82);opacity:.8}}
@keyframes iaFlash{0%,40%,60%,100%{opacity:0}45%,55%{opacity:1}50%{opacity:.4}}
@keyframes iaHum{from{opacity:.65}to{opacity:1}}
@keyframes iaShimmer{from{opacity:.55}to{opacity:1}}
@keyframes iaDrift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
@keyframes iaWiggle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes iaBounce{from{transform:scaleY(1)}to{transform:scaleY(.9) translateY(2px)}}
@keyframes iaWave{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
@keyframes iaStrum{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes iaBuzz{from{transform:translateX(-.8px)}to{transform:translateX(.8px)}}
@keyframes iaGlint{0%,70%,100%{opacity:.6}80%{opacity:1}}
@keyframes iaBlink{0%{opacity:1}100%{opacity:.25}}
@keyframes iaRise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
@keyframes iaFall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(14px);opacity:0}}
@keyframes iaSnow{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(8px,120px);opacity:0}}
@keyframes iaConfetti{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(130px) rotate(540deg);opacity:0}}
@keyframes iaLeaf{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(10px,60px) rotate(120deg)}100%{transform:translate(-6px,130px) rotate(260deg);opacity:0}}
@keyframes iaNotes{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(6px,-28px);opacity:0}}
@keyframes iaFirefly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(6px,-6px);opacity:1}}
@keyframes iaDrip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes iaTrace{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
/* item actions (8 s cycle; the action happens near the end of each cycle) */
.bug .it .ac{transform-box:view-box;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.ac-move{animation-name:acMove}.ac-drink{animation-name:acDrink}.ac-raise{animation-name:acRaise}.ac-tap{animation-name:acTap}.ac-swish{animation-name:acSwish}.ac-twirl{animation-name:acTwirl}.ac-strum{animation-name:acStrum}.ac-shake{animation-name:acShake}.ac-flutter{animation-name:acFlutter}
@keyframes acMove{0%,70%,100%{transform:none}77%,90%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
@keyframes acDrink{0%,66%,100%{transform:none}73%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}79%,86%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--r) - 28deg))}92%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}97%{transform:none}}
@keyframes acRaise{0%,68%,100%{transform:none}75%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}79%{transform:translate(var(--dx),calc(var(--dy) - 8px)) rotate(var(--r))}83%,90%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}96%{transform:none}}
@keyframes acTap{0%,74%,100%{transform:none}78%,86%{transform:translateY(-9px)}82%,90%{transform:none}}
@keyframes acSwish{0%,74%,100%{transform:none}79%{transform:rotate(-35deg)}85%{transform:rotate(30deg)}91%{transform:rotate(-10deg)}95%{transform:none}}
@keyframes acTwirl{0%,76%{transform:rotate(0)}92%,100%{transform:rotate(360deg)}}
@keyframes acStrum{0%,76%,100%{transform:none}79%,83%,87%,91%{transform:rotate(-7deg)}81%,85%,89%{transform:rotate(7deg)}}
@keyframes acShake{0%,78%,100%{transform:none}80%,84%,88%,92%{transform:rotate(-14deg)}82%,86%,90%{transform:rotate(14deg)}}
@keyframes acFlutter{0%,78%,100%{transform:scaleX(1)}80%,84%,88%{transform:scaleX(.62)}82%,86%,90%{transform:scaleX(1.05)}}
.excard{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;display:flex;flex-direction:column;gap:6px}

.excard.weak{border-left:4px solid var(--gold)}
.tourpanel{max-width:420px;text-align:center;padding:22px}.tourpanel .tourart svg{width:120px;height:120px}.tourbig{font-size:2.4rem;margin:20px 0}
