<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Update notes · DrugBug Dashboard</title>
<link rel="icon" type="image/png" sizes="48x48" href="../icon-48.png">
<style>
/* Layout: an add box on top, then the notes grouped by stage (Doing, Planned, Ideas, Done). */
:root{--bg:#13111c;--card:#1d1a2a;--ink:#f2effb;--mut:#aaa3c4;--line:#322c47;--soft:#251f37;--accent:#a78bfa;--accent-ink:#13111c;--hi:#f87171;--md:#fbbf24;--lo:#7d7896;--done:#34d399;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#f6f4fc;--card:#fff;--ink:#1c1730;--mut:#5f5878;--line:#e2dcef;--soft:#f1edfa;--accent:#6d28d9;--accent-ink:#fff;--hi:#b91c1c;--md:#b45309;--lo:#8a85a0;--done:#047857;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
body.embed .wrap{padding-top:4px;max-width:none;padding-left:0;padding-right:0}
h1{font-size:22px;margin:0}
.sub,.sync,.small{color:var(--mut);font-size:13px;margin:4px 0 0}
.add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0 18px;display:grid;gap:10px}
textarea,input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.ghost{font:inherit;font-size:13px;font-weight:650;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ghost.danger{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 40%,var(--line))}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input{flex:1 1 220px}
h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:22px 0 8px;display:flex;justify-content:space-between}
h2 span{color:var(--mut);letter-spacing:0;text-transform:none;font-weight:500}
.list{display:grid;gap:8px}
.n{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--p,var(--lo));border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.n.done{opacity:.7}
.n .t{white-space:pre-wrap;overflow-wrap:anywhere}
.n.done .t{text-decoration:line-through;text-decoration-color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut)}
.pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--soft);color:var(--mut)}
.pill.hi{color:var(--hi)}.pill.md{color:var(--md)}
.meta select{font-size:12.5px;padding:3px 6px}
.meta .sp{margin-left:auto;display:flex;gap:6px}
.empty{color:var(--mut);font-size:14px;padding:6px 2px}
.confirm{font-size:13px;color:var(--hi);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.send b{font-size:14px}
.send .small{margin:0}
.pick{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.pick input{width:18px;height:18px;margin:3px 0 0;flex:none;accent-color:var(--accent)}
.pill.sent{color:var(--accent)}
.copybox{width:100%;min-height:140px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Update notes</h1>
  <p class="sub">Ideas and changes you want to make to DrugBug. Saved on this computer right away and synced when you're online.</p>
  <p class="sync" id="sync">Starting…</p>

  <form class="add" id="add">
    <label class="small" for="nt" style="margin:0">What do you want to change or add?</label>
    <textarea id="nt" maxlength="4000" placeholder="Example: Add a pediatric dosing quiz to the paramedic level"></textarea>
    <div class="row">
      <label class="small" for="na" style="margin:0">Area</label>
      <select id="na"></select>
      <label class="small" for="np" style="margin:0">Priority</label>
      <select id="np"><option value="hi">High</option><option value="md" selected>Medium</option><option value="lo">Low</option></select>
      <button class="btn" type="submit">Add note</button>
    </div>
  </form>

  <div class="bar">
    <input type="search" id="q" placeholder="Search notes" aria-label="Search notes">
    <select id="fa" aria-label="Area"></select>
  </div>
  <div class="send" id="sendbar">
    <b>Send to Claude</b>
    <span class="small" id="selcount">Tick the notes you want, or send them all.</span>
    <span style="flex:1"></span>
    <button class="ghost" type="button" id="selAll">Select all</button>
    <button class="ghost" type="button" id="selNone">Clear</button>
    <button class="btn" type="button" id="sendSel">Send selected</button>
    <button class="btn" type="button" id="sendAll">Send all open notes</button>
    <p class="small" id="sendmsg" style="flex-basis:100%" hidden></p>
    <textarea class="copybox" id="copybox" readonly hidden aria-label="Notes to paste into Claude"></textarea>
  </div>
  <div id="groups"></div>
</div>

<script src="../app/vendor/firebase-app-compat.js"></script>
<script src="../app/vendor/firebase-auth-compat.js"></script>
<script src="dash.js?v=6"></script>
<script>
(function(){
  "use strict";
  if(/[?&]embed=1/.test(location.search))document.body.classList.add("embed");
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var AREAS=[["app","App"],["content","Drugs & questions"],["web","Website"],["school","Instructors & schools"],["dash","Dashboard"],["store","App Store & marketing"],["other","Other"]];
  var AN={};AREAS.forEach(function(a){AN[a[0]]=a[1]});
  var STAGES=[["doing","Doing now"],["planned","Planned"],["idea","Ideas"],["done","Done"]];
  var PN={hi:"High",md:"Medium",lo:"Low"}, PR={hi:0,md:1,lo:2};
  var EDIT={}, ASK={}, SEL={}, F={q:"",a:""};
  $("na").innerHTML=AREAS.map(function(a){return '<option value="'+a[0]+'">'+esc(a[1])+'</option>'}).join("");
  $("fa").innerHTML='<option value="">All areas</option>'+AREAS.map(function(a){return '<option value="'+a[0]+'">'+esc(a[1])+'</option>'}).join("");
  try{var sa=localStorage.getItem("dbd:lastarea");if(sa)$("na").value=sa}catch(e){}

  function item(id,n){
    var h='<div class="n'+(n.s==="done"?' done':'')+'" style="--p:var(--'+(n.p||"md")+')" data-id="'+esc(id)+'">';
    if(EDIT[id]){
      h+='<textarea id="ed-'+esc(id)+'" maxlength="4000">'+esc(n.t)+'</textarea><div class="row"><button class="btn" type="button" data-save="'+esc(id)+'">Save</button><button class="ghost" type="button" data-cancel="'+esc(id)+'">Cancel</button></div>';
    } else h+='<label class="pick"><input type="checkbox" data-sel="'+esc(id)+'"'+(SEL[id]?' checked':'')+' aria-label="Select this note"><span class="t">'+esc(n.t)+'</span></label>';
    h+='<div class="meta"><span class="pill '+esc(n.p||"md")+'">'+esc(PN[n.p]||"Medium")+'</span><span class="pill">'+esc(AN[n.a]||"Other")+'</span>'+(n.q?'<span class="pill sent">Sent to Claude '+new Date(n.q).toLocaleDateString()+'</span>':'')+'<span>Added '+new Date(n.c||n.at).toLocaleDateString()+(n.s==="done"&&n.d?' · done '+new Date(n.d).toLocaleDateString():'')+'</span>'+
      '<span class="sp"><select data-stage="'+esc(id)+'" aria-label="Stage">'+STAGES.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===(n.s||"idea")?' selected':'')+'>'+esc(s[1])+'</option>'}).join("")+'</select>'+
      '<select data-prio="'+esc(id)+'" aria-label="Priority">'+["hi","md","lo"].map(function(p){return '<option value="'+p+'"'+(p===(n.p||"md")?' selected':'')+'>'+PN[p]+'</option>'}).join("")+'</select>'+
      (EDIT[id]?'':'<button class="ghost" type="button" data-edit="'+esc(id)+'">Edit</button><button class="ghost danger" type="button" data-del="'+esc(id)+'">Delete</button>')+'</span></div>';
    if(ASK[id])h+='<div class="confirm">Delete this note for good? <button class="ghost danger" type="button" data-yes="'+esc(id)+'">Delete</button><button class="ghost" type="button" data-no="'+esc(id)+'">Keep it</button></div>';
    return h+'</div>';
  }
  function render(){
    var all=DASH.all("notes"), q=F.q.trim().toLowerCase();
    var ids=Object.keys(all).filter(function(id){var n=all[id];return (!F.a||n.a===F.a)&&(!q||(n.t||"").toLowerCase().indexOf(q)>=0)});
    $("groups").innerHTML=STAGES.map(function(st){
      var g=ids.filter(function(id){return (all[id].s||"idea")===st[0]}).sort(function(a,b){var x=all[a],y=all[b];return st[0]==="done"?(y.d||y.at)-(x.d||x.at):(PR[x.p]-PR[y.p])||((y.c||0)-(x.c||0))});
      return '<h2>'+esc(st[1])+'<span>'+g.length+'</span></h2><div class="list">'+(g.length?g.map(function(id){return item(id,all[id])}).join(""):'<div class="empty">'+(st[0]==="idea"&&!ids.length?'No notes yet. Add your first one above.':'Nothing here.')+'</div>')+'</div>';
    }).join("");
    selCount();
  }
  function upd(id,patch){var n=Object.assign({},DASH.get("notes",id)||{},patch);delete n.up;DASH.put("notes",id,n)}
  $("add").addEventListener("submit",function(e){
    e.preventDefault();var t=$("nt").value.trim();if(!t)return;
    var id="n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    DASH.put("notes",id,{t:t.slice(0,4000),a:$("na").value,p:$("np").value,s:"idea",c:Date.now()});
    try{localStorage.setItem("dbd:lastarea",$("na").value)}catch(x){}
    $("nt").value="";$("nt").focus();
  });
  $("q").addEventListener("input",function(e){F.q=e.target.value;render()});
  $("fa").addEventListener("change",function(e){F.a=e.target.value;render()});
  $("groups").addEventListener("change",function(e){
    var t=e.target,id;
    if((id=t.getAttribute("data-stage"))){var p={s:t.value};if(t.value==="done")p.d=Date.now();upd(id,p)}
    else if((id=t.getAttribute("data-prio")))upd(id,{p:t.value});
  });
  $("groups").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;var id;
    if((id=b.getAttribute("data-edit"))){EDIT[id]=1;render();var x=$("ed-"+id);if(x)x.focus();}
    else if((id=b.getAttribute("data-cancel"))){delete EDIT[id];render()}
    else if((id=b.getAttribute("data-save"))){var v=$("ed-"+id).value.trim();delete EDIT[id];if(v)upd(id,{t:v.slice(0,4000)});else render()}
    else if((id=b.getAttribute("data-del"))){ASK[id]=1;render()}
    else if((id=b.getAttribute("data-no"))){delete ASK[id];render()}
    else if((id=b.getAttribute("data-yes"))){delete ASK[id];DASH.del("notes",id)}
  });
  function visibleOpen(){var all=DASH.all("notes"),q=F.q.trim().toLowerCase();return Object.keys(all).filter(function(id){var n=all[id];return (n.s||"idea")!=="done"&&(!F.a||n.a===F.a)&&(!q||(n.t||"").toLowerCase().indexOf(q)>=0)})}
  function selCount(){var n=Object.keys(SEL).filter(function(k){return SEL[k]&&DASH.get("notes",k)}).length;$("selcount").textContent=n?n+" selected":"Tick the notes you want, or send them all.";$("sendSel").disabled=!n}
  function compose(ids){
    var all=DASH.all("notes"),order={doing:0,planned:1,idea:2,done:3};
    ids=ids.filter(function(id){return all[id]}).sort(function(a,b){var x=all[a],y=all[b];return (order[x.s||"idea"]-order[y.s||"idea"])||(PR[x.p||"md"]-PR[y.p||"md"])});
    var st={};STAGES.forEach(function(s){st[s[0]]=s[1]});
    return "Here are my DrugBug update notes to work on ("+ids.length+"):\n\n"+ids.map(function(id,i){var n=all[id];return (i+1)+". "+n.t+"\n   ["+(PN[n.p]||"Medium")+" priority · "+(AN[n.a]||"Other")+" · "+st[n.s||"idea"]+" · note id "+id+"]"}).join("\n\n");
  }
  function send(ids){
    if(!ids.length){$("sendmsg").textContent="No notes to send. Add one above, or tick the ones you want.";$("sendmsg").hidden=false;return}
    var txt=compose(ids), now=Date.now();
    ids.forEach(function(id){var n=DASH.get("notes",id);if(n){var c=Object.assign({},n,{q:now});delete c.up;DASH.put("notes",id,c)}});
    $("copybox").value=txt;$("copybox").hidden=false;
    var done=function(ok){$("sendmsg").textContent=(ok?"Copied "+ids.length+" note"+(ids.length===1?"":"s")+". ":"Select the text below and copy it (Ctrl+C). ")+"Paste it into your Claude chat. They're also marked \"Sent to Claude\", so you can just tell Claude \"check my dashboard notes\".";$("sendmsg").hidden=false;if(!ok){$("copybox").focus();$("copybox").select()}};
    try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
    SEL={};render();
  }
  $("selAll").addEventListener("click",function(){visibleOpen().forEach(function(id){SEL[id]=1});render()});
  $("selNone").addEventListener("click",function(){SEL={};render()});
  $("sendSel").addEventListener("click",function(){send(Object.keys(SEL).filter(function(k){return SEL[k]}))});
  $("sendAll").addEventListener("click",function(){send(Object.keys(DASH.all("notes")).filter(function(id){return (DASH.get("notes",id).s||"idea")!=="done"}))});
  $("groups").addEventListener("change",function(e){var id=e.target.getAttribute("data-sel");if(id){if(e.target.checked)SEL[id]=1;else delete SEL[id];selCount()}});
  DASH.on(function(){var a=document.activeElement;if(a&&a.id&&/^ed-/.test(a.id))return;render()});
  DASH.onStatus(function(st){$("sync").textContent=DASH.statusText(st)});
  render();
})();
</script>
</body>
</html>
