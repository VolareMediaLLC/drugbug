<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DrugBug Question Editor</title>
<meta name="theme-color" content="#13111c">
<link rel="icon" type="image/png" sizes="48x48" href="../admin/icon-48.png">
<style>
:root{--bg:#13111c;--surface:#1d1a2a;--surface2:#251f37;--ink:#f2effb;--muted:#aaa3c4;--line:#322c47;--accent:#a78bfa;--teal:#2dd4bf;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--track:#2b2540;--add:#12372b;--del:#45202a}
@media (prefers-color-scheme:light){:root{--bg:#f6f4fc;--surface:#fff;--surface2:#f1edfa;--ink:#1c1730;--muted:#5f5878;--line:#e2dcef;--accent:#6d28d9;--teal:#0f766e;--good:#047857;--warn:#b45309;--bad:#b91c1c;--track:#ece7f6;--add:#d6f5e3;--del:#fde0e0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1380px;margin:0 auto;padding:14px 16px 70px}
.hide{display:none!important}
header.site{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 0 12px;border-bottom:1px solid var(--line)}
header.site img{width:34px;height:34px;border-radius:9px}header.site b{font-size:19px}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--accent);color:#fff}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:10px 0;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:none;font:inherit;font-weight:650;font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--surface)}
nav.tabs button[aria-selected=true]{color:var(--ink);background:var(--surface);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--accent)}
nav.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px}.card h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.btn.good{background:var(--good);color:#04261a}button.btn.bad{background:var(--bad);color:#2b0606}button.btn.warn{background:var(--warn);color:#2b1c02}
button.ghost{font:inherit;font-size:13px;font-weight:650;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.ghost:hover{border-color:var(--accent)}button.ghost[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:44px}
input[type=checkbox]{width:auto}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.msg{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:14px;margin:8px 0}
.msg.err{border-color:var(--bad)}.msg.ok{border-color:var(--good)}.msg.warn{border-color:var(--warn)}
/* filter bar */
.filters{display:grid;grid-template-columns:2fr repeat(6,1fr);gap:8px}
@media (max-width:1000px){.filters{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.flag{border-color:var(--warn);color:var(--warn)}.chip.block{border-color:var(--bad);color:var(--bad)}.chip.okc{border-color:var(--good);color:var(--good)}
.chip.s-live{color:var(--good);border-color:var(--good)}.chip.s-draft{color:var(--teal);border-color:var(--teal)}.chip.s-needs_ai_repair,.chip.s-hidden{color:var(--bad);border-color:var(--bad)}.chip.s-ai_fixed_pending_review{color:var(--warn);border-color:var(--warn)}.chip.s-retired,.chip.s-rule{color:var(--muted)}
/* list */
.qrow{display:grid;grid-template-columns:26px 150px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow:hover{background:var(--surface2)}.qrow .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:800px){.qrow{grid-template-columns:26px 1fr}.qrow .meta,.qrow .fl{grid-column:2}}
/* editor */
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1050px){.split{grid-template-columns:1fr}}
.opt{display:grid;grid-template-columns:30px 1fr 60px;gap:8px;align-items:center;margin-bottom:6px}
.opt .let{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--track)}
.opt.right .let{background:var(--good);color:#04261a}
.bar{height:8px;border-radius:9px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.bar.over i{background:var(--bad)}
.lint li{margin:2px 0}.lint{margin:6px 0 0;padding-left:18px;font-size:13px}
.phone{width:100%;max-width:360px;margin:0 auto;border:10px solid #0b0a12;border-radius:36px;background:#111827;color:#EEF2FF;padding:18px 14px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phone .ph-top{font-size:11px;color:#9AA6C6;display:flex;justify-content:space-between;margin-bottom:10px}
.phone .ph-q{font-size:16px;font-weight:650;line-height:1.4;margin-bottom:14px}
.phone button.ph-o{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;line-height:1.35;padding:12px 14px;margin-bottom:9px;border-radius:14px;border:1.5px solid #2A3550;background:#1A2338;color:#EEF2FF;cursor:pointer;box-shadow:0 3px 0 #080C17}
.phone button.ph-o.ok{border-color:#34C374;background:#123524}.phone button.ph-o.no{border-color:#F2686C;background:#3b1a1e}
.phone .ph-x{font-size:13.5px;line-height:1.45;background:#1F2A44;border-radius:12px;padding:10px 12px;margin-top:6px}
/* diff */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:900px){.two{grid-template-columns:1fr}}
.side{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.side h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.side ol{margin:8px 0;padding-left:22px}.side li{margin:3px 0}.side li.right{font-weight:700;color:var(--good)}
ins{background:var(--add);text-decoration:none;border-radius:3px;padding:0 2px}del{background:var(--del);border-radius:3px;padding:0 2px}
.tk{border-left:3px solid var(--warn);padding:4px 10px;margin:6px 0;font-size:13px;background:var(--surface2);border-radius:0 8px 8px 0}.tk.urgent{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase}
.verd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media (max-width:600px){.verd{grid-template-columns:1fr}}
.verd button{padding:14px 8px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <img src="../admin/icon-48.png" alt=""><b>DrugBug Question Editor</b><span class="badge" id="roleBadge"></span>
  <div class="who" id="who"></div>
</header>

<section id="vIn" class="card hide" style="max-width:440px;margin:40px auto">
  <h2>Sign in</h2><p class="muted small">For the DrugBug owner and evaluators.</p>
  <label class="f" for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label class="f" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:12px"><button class="btn" id="bIn">Sign in</button><button class="ghost" id="bGoogle">Continue with Google</button></div>
  <div id="inMsg" class="msg err hide"></div>
</section>

<section id="vJoin" class="card hide" style="max-width:480px;margin:40px auto">
  <h2>Enter your evaluator code</h2>
  <p class="muted small">This sign-in is not linked to an evaluator code yet. Type the code Adam gave you (it starts with EVAL). You only do this once.</p>
  <input id="joinCode" placeholder="EVAL-XXXXXX" autocomplete="off" style="text-transform:uppercase">
  <div class="row" style="margin-top:12px"><button class="btn" id="bJoin">Link my code</button></div>
  <div id="joinMsg" class="msg err hide"></div>
</section>

<div id="vMain" class="hide">
  <nav class="tabs" id="tabs"></nav>
  <div id="topMsg" class="msg hide"></div>
  <section data-page="browse" class="hide"></section>
  <section data-page="edit" class="hide"></section>
  <section data-page="review" class="hide"></section>
  <section data-page="queue" class="hide"></section>
  <section data-page="signoff" class="hide"></section>
  <section data-page="evals" class="hide"></section>
  <section data-page="proto" class="hide"></section>
</div>
</div>

<script src="../app/vendor/firebase-app-compat.js"></script>
<script src="../app/vendor/firebase-auth-compat.js"></script>

  }
  /* pages or pasted text -> sections. A heading is a markdown heading, a numbered title, or a short line in capitals. */

      if (isHead(l)) { push(); cur = { title: l.replace(/^#+\s*/, "").slice(0, 160), page: p.page ? String(p.page) : "", text: "" }; return; }

  }
  function drawProto() {

        (r.protocols.length ? "<table><tr><th>Protocol</th><th>Code</th><th>Roles</th><th>Effective</th><th>Status</th><th>Text</th><th>Questions</th><th></th></tr>" + r.protocols.map(function (p) {

  function openProto(id) {
    var P = page("proto"), isNew = id === "new";
    (isNew ? Promise.resolve({ doc: { name: "", code: "", setId: "", roles: [], effective: "", status: "draft" }, sections: [] }) : call("qpGet", { id: id, full: true })).then(function (r) {

        '<div class="card"><h2>' + (isNew ? "Add a protocol" : esc(d.name)) + '</h2><div class="row"><div style="flex:2;min-width:260px"><label class="f" for="pName">Protocol name</label><input id="pName" value="' + esc(d.name) + '" placeholder="Montgomery County Hospital District EMS 2026"></div>' +
        '<div style="flex:1;min-width:150px"><label class="f" for="pCode">Region / agency code</label><input id="pCode" value="' + esc(d.code || "") + '" placeholder="MCHD"></div>' +
        '<div style="flex:1;min-width:150px"><label class="f" for="pEff">Effective date</label><input id="pEff" type="date" value="' + esc(d.effective || "") + '"></div>' +
        '<div style="flex:1;min-width:140px"><label class="f" for="pStatus">Status</label><select id="pStatus">' + opt("draft", "Draft", d.status) + opt("live", "Live", d.status) + opt("archived", "Archived", d.status) + "</select></div></div>" +
        '<label class="f" for="pSet">Who gets this pack: the protocol set people pick in the app\'s Protocols tab</label><select id="pSet">' + opt("", "Not linked yet (questions stay in the editor only)", d.setId) + PR.sets.map(function (s) { return opt(s.id, s.name + (s.state ? " (" + s.state + ")" : "") + (s.status === "unpublished" ? " · unpublished" : ""), d.setId); }).join("") + "</select>" +
        '<label class="f">Target roles</label><div class="chips" id="pRoles">' + roleKeys.map(function (k) { return '<span class="chip' + ((d.roles || []).indexOf(k) >= 0 ? " on" : "") + '" data-r="' + k + '">' + esc(LV[k]) + "</span>"; }).join("") + "</div>" +
        '<div class="row" style="margin-top:12px"><button class="btn" id="pSave">' + (isNew ? "Save and continue" : "Save details") + '</button><span id="pSaveMsg" class="small muted"></span></div></div>' +
        (isNew ? "" :
          '<div class="card"><h3>Protocol text</h3><p class="small muted">' + (d.nSections ? d.nSections + " sections, " + (d.chars || 0).toLocaleString() + " characters, loaded " + ago(d.textAt) + ". Uploading again replaces the text (do this when the protocol changes); approved questions are kept." : "No text yet. Choose a PDF, Markdown or text file, or paste the text.") + (d.file && d.file.error ? '<br><span style="color:var(--warn)">' + esc(d.file.error) + "</span>" : d.file && d.file.path ? "<br>Original file kept: " + esc(d.file.name) : "") + '</p><div class="row"><input type="file" id="pFile" accept=".pdf,.md,.markdown,.txt,application/pdf,text/plain,text/markdown" style="max-width:320px"><span class="muted small">or</span><button class="ghost" id="pPasteBtn">Paste text</button></div><textarea id="pPaste" class="hide" rows="8" placeholder="Paste the protocol text here. Start each section with a heading line." style="margin-top:8px"></textarea><div id="pDraft"></div></div>' +
          (r.sections.length ? '<div class="card"><div class="row sp"><h3 style="margin:0">Sections</h3><div class="row"><input id="pSearch" type="search" placeholder="Search the protocol text (a medication, a word)" style="width:320px"><button class="ghost" id="pAll">Select shown</button><button class="ghost" id="pNone">Clear</button></div></div><div id="pSecs" style="max-height:420px;overflow:auto;margin-top:8px"></div></div>' +
            '<div class="card"><h3>Generate questions from this protocol</h3><p class="small muted">Claude is given only the sections you tick and may not use anything else. Each question must quote the passage it is based on; the server checks that the passage is really in the text and drops the question if it is not. Protocol doses and standing orders may be tested in this mode.</p><div class="row"><div style="flex:1;min-width:200px"><label class="f" for="gLv">Role</label><select id="gLv">' + ((d.roles || []).length ? d.roles : roleKeys).map(function (k) { return opt(k, LV[k] || k, ""); }).join("") + '</select></div><div style="width:110px"><label class="f" for="gN">How many</label><input id="gN" type="number" min="1" max="' + ME.aiMax + '" value="10"></div><div style="width:240px"><label class="f">Easy / Normal / Hard %</label><div class="row" style="flex-wrap:nowrap"><input id="gE" type="number" value="20"><input id="gM" type="number" value="60"><input id="gH" type="number" value="20"></div></div><div style="flex:2;min-width:220px"><label class="f" for="gFocus">Focus (optional)</label><input id="gFocus" placeholder="e.g. RSI medications and their doses"></div></div><div class="row" style="margin-top:12px"><button class="btn" id="gGo">Generate questions from protocol</button><span class="small muted" id="gSel"></span></div><div id="gMsg" class="msg hide"></div></div>' : ""));

          (secs.length ? '<div style="max-height:260px;overflow:auto">' + secs.map(function (x, i) { return '<div class="row" style="margin-bottom:4px;flex-wrap:nowrap"><input data-st="' + i + '" value="' + esc(x.title) + '"><span class="small muted" style="white-space:nowrap">' + (x.page ? "p. " + esc(x.page) + " · " : "") + x.text.length.toLocaleString() + " chars</span></div>"; }).join("") + '</div><div class="row" style="margin-top:8px"><button class="btn" id="pSaveText">Save this text</button></div>' : "");
        if ($("pSaveText")) $("pSaveText").onclick = function () {
          var b = this; b.disabled = true; P.querySelectorAll("[data-st]").forEach(function (i) { secs[+i.dataset.st].title = i.value; });
          call("qpSections", { id: id, sections: secs, file: file || null }).then(function (x) { top("Saved " + x.sections + " sections." + (x.file && x.file.error ? " The original file itself was not stored; the text was." : ""), "ok"); openProto(id); }).catch(function (e) { b.disabled = false; top(errTxt(e), "err"); });
        };

      $("pPasteBtn").onclick = function () { show("pPaste", true); $("pPaste").focus(); };
      $("pPaste").onchange = function () { draft(sectionize([{ page: 0, lines: this.value.split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean) }])); };

    }).catch(function (e) { P.innerHTML = '<div class="msg err">' + esc(errTxt(e)) + '</div><button class="ghost" id="pBack2">← All protocols</button>'; $("pBack2").onclick = function () { PR.cur = null; drawProto(); }; });
  }
